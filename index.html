<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AA Plus Consultants</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            /* Light Grey Background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1f2937;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .logo-container img {
            max-height: 50px;
            /* Adjust based on your logo shape */
            width: auto;
            margin-bottom: 10px;
        }

        h2 {
            margin: 0 0 5px 0;
            color: #111827;
            font-size: 1.5rem;
        }

        p.subtitle {
            margin: 0 0 30px 0;
            color: #6b7280;
            font-size: 0.95rem;
        }

        /* Inputs */
        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 5px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
            /* Fixes padding issues */
        }

        input:focus {
            border-color: #0d47a1;
            box-shadow: 0 0 0 3px rgba(13, 71, 161, 0.1);
        }

        /* Button */
        button {
            width: 100%;
            padding: 12px;
            background-color: #0d47a1;
            /* AA Plus Blue */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1e40af;
        }

        button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }

        /* Error Message */
        .error-msg {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
            /* Hidden by default */
            text-align: left;
            border: 1px solid #fca5a5;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="AAPlus Logo.png" alt="AA Plus Logo">
        </div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your compliance portal</p>

        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="client@aaplus.com">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button id="login-btn" type="button">Sign In</button>

        <div id="error-box" class="error-msg"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 1. CHECK FOR INVITE/RECOVERY LINK IMMEDIATELY (before Supabase processes it)
        (function() {
            const hash = window.location.hash;
            if (hash) {
                const hashParams = new URLSearchParams(hash.substring(1));
                const type = hashParams.get('type');
                const accessToken = hashParams.get('access_token');

                // If this is an invite or recovery link, redirect to profile with the hash
                if ((type === 'invite' || type === 'recovery' || type === 'magiclink') && accessToken) {
                    window.location.href = 'profile.html' + hash;
                    return;
                }
            }
        })();

        // 2. CONFIGURATION
        const supabaseUrl = 'https://qitojxxbqsgypbavkkch.supabase.co';
        const supabaseKey = 'sb_publishable_PCJvu-s9XkCDGUvDZgsXhQ_myIhmu4t';
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        // 3. DOM ELEMENTS
        const loginBtn = document.getElementById('login-btn');
        const errorBox = document.getElementById('error-box');

        // 3. LOGIN FUNCTION
        async function handleLogin() {
            // Clear previous errors
            errorBox.style.display = 'none';
            errorBox.innerText = '';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Basic Validation
            if (!email || !password) {
                showError("Please enter both email and password.");
                return;
            }

            // UI Feedback (Loading)
            const originalText = loginBtn.innerText;
            loginBtn.innerText = "Verifying...";
            loginBtn.disabled = true;

            try {
                // Supabase Auth
                const { data, error } = await client.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw error; // Jump to catch block
                }

                // Success! Redirect.
                console.log("Login success:", data);
                const adminEmails = ['advait@aaplusconsultants.com', 'radhakrishnan@aaplusconsultants.com', 'praveen@aaplusconsultants.com'];
                if (adminEmails.includes(email)) {
                    window.location.href = "admin_dashboard.html";
                } else {
                    window.location.href = "client_dashboard.html";
                }

            } catch (err) {
                console.error("Login Error:", err);
                showError(err.message); // Show error to user

                // Reset Button
                loginBtn.innerText = originalText;
                loginBtn.disabled = false;
            }
        }

        function showError(msg) {
            errorBox.innerText = msg;
            errorBox.style.display = 'block';
        }

        // 4. EVENT LISTENERS
        loginBtn.addEventListener('click', handleLogin);

        // Allow pressing "Enter" key to login
        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleLogin();
        });

    </script>
</body>

</html>
