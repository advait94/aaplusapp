<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password | AA Plus</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo img {
            height: 40px;
        }

        h1 {
            font-size: 1.75rem;
            color: #1e3a5f;
            text-align: center;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #1e3a5f;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d4a6f 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 58, 95, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .success {
            background: #f0fdf4;
            color: #16a34a;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            background: #e2e8f0;
            margin-top: 8px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">
            <img src="assets/AAPlus Logo.png" alt="AA Plus">
        </div>

        <h1>Set Your Password</h1>
        <p class="subtitle">Create a secure password to access your dashboard</p>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>

        <form id="password-form" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="password" placeholder="Enter password (min 8 characters)" required
                    minlength="8">
                <div class="password-strength">
                    <div class="password-strength-bar" id="strength-bar"></div>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="btn" id="submit-btn">
                <i class="fas fa-lock"></i> Set Password & Continue
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://qitojxxbqsgypbavkkch.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpdG9qeHhicXNneXBiYXZra2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2MzM0MjcsImV4cCI6MjA4MzIwOTQyN30.QyFvxun-oFAXPvVuELd5jTojQ7AbEYrNtrfM3saqE-4';

        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check password strength
        document.getElementById('password').addEventListener('input', function (e) {
            const password = e.target.value;
            const strengthBar = document.getElementById('strength-bar');
            let strength = 0;

            if (password.length >= 8) strength += 25;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength += 25;
            if (password.match(/\d/)) strength += 25;
            if (password.match(/[^a-zA-Z\d]/)) strength += 25;

            strengthBar.style.width = strength + '%';
            strengthBar.style.background = strength < 50 ? '#ef4444' : strength < 75 ? '#f59e0b' : '#10b981';
        });

        async function handleSubmit(e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorEl = document.getElementById('error');
            const successEl = document.getElementById('success');
            const btn = document.getElementById('submit-btn');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (password !== confirmPassword) {
                errorEl.textContent = 'Passwords do not match';
                errorEl.style.display = 'block';
                return;
            }

            if (password.length < 8) {
                errorEl.textContent = 'Password must be at least 8 characters';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Setting password...';

            try {
                // Update the user's password
                const { error } = await client.auth.updateUser({ password: password });

                if (error) throw error;

                successEl.textContent = 'Password set successfully! Redirecting...';
                successEl.style.display = 'block';

                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'client_dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('Error:', error);
                errorEl.textContent = error.message || 'Failed to set password. Please try again.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-lock"></i> Set Password & Continue';
            }
        }

        // Check if user has a valid session from the recovery link
        async function checkSession() {
            const { data: { session } } = await client.auth.getSession();

            if (!session) {
                // No session - redirect to login
                document.getElementById('error').textContent = 'Invalid or expired link. Please request a new password reset.';
                document.getElementById('error').style.display = 'block';
                document.getElementById('password-form').style.display = 'none';
            }
        }

        checkSession();
    </script>
</body>

</html>
