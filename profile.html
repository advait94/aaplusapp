<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - AA Plus Consultants</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1f2937;
        }

        .profile-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .logo-container img {
            max-height: 50px;
            width: auto;
            margin-bottom: 10px;
        }

        h2 {
            margin: 0 0 5px 0;
            color: #111827;
            font-size: 1.5rem;
        }

        p.subtitle {
            margin: 0 0 30px 0;
            color: #6b7280;
            font-size: 0.95rem;
        }

        .user-email {
            background-color: #f3f4f6;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #374151;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 5px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #0d47a1;
            box-shadow: 0 0 0 3px rgba(13, 71, 161, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0d47a1;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1e40af;
        }

        button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }

        .error-msg {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
            text-align: left;
            border: 1px solid #fca5a5;
        }

        .success-msg {
            background-color: #d1fae5;
            color: #065f46;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
            text-align: left;
            border: 1px solid #6ee7b7;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0d47a1;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="profile-card">
        <div class="logo-container">
            <img src="AAPlus Logo.png" alt="AA Plus Logo">
        </div>

        <h2>Update Password</h2>
        <p class="subtitle">Enter your new password below</p>

        <div id="user-email" class="user-email"></div>

        <div class="input-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" placeholder="••••••••">
        </div>

        <div class="input-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="••••••••">
        </div>

        <button id="update-btn" type="button">Update Password</button>

        <div id="error-box" class="error-msg"></div>
        <div id="success-box" class="success-msg"></div>

        <a href="#" id="back-link" class="back-link">Back to Dashboard</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://qitojxxbqsgypbavkkch.supabase.co';
        const supabaseKey = 'sb_publishable_PCJvu-s9XkCDGUvDZgsXhQ_myIhmu4t';
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        const updateBtn = document.getElementById('update-btn');
        const errorBox = document.getElementById('error-box');
        const successBox = document.getElementById('success-box');
        const userEmailDiv = document.getElementById('user-email');
        const backLink = document.getElementById('back-link');

        const adminEmails = ['advait@aaplusconsultants.com', 'radhakrishnan@aaplusconsultants.com', 'praveen@aaplusconsultants.com'];

        // Check if user is logged in
        async function checkAuth() {
            const { data: { user } } = await client.auth.getUser();

            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            userEmailDiv.textContent = user.email;

            // Set back link based on user role
            if (adminEmails.includes(user.email)) {
                backLink.href = 'admin_dashboard.html';
            } else {
                backLink.href = 'client_dashboard.html';
            }
        }

        async function handleUpdatePassword() {
            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!newPassword) {
                showError("Please enter a new password.");
                return;
            }

            if (newPassword.length < 6) {
                showError("Password must be at least 6 characters.");
                return;
            }

            if (newPassword !== confirmPassword) {
                showError("Passwords do not match.");
                return;
            }

            const originalText = updateBtn.innerText;
            updateBtn.innerText = "Updating...";
            updateBtn.disabled = true;

            try {
                const { data, error } = await client.auth.updateUser({
                    password: newPassword
                });

                if (error) {
                    throw error;
                }

                showSuccess("Password updated successfully!");
                document.getElementById('new-password').value = '';
                document.getElementById('confirm-password').value = '';

            } catch (err) {
                console.error("Update Error:", err);
                showError(err.message);
            } finally {
                updateBtn.innerText = originalText;
                updateBtn.disabled = false;
            }
        }

        function showError(msg) {
            errorBox.innerText = msg;
            errorBox.style.display = 'block';
            successBox.style.display = 'none';
        }

        function showSuccess(msg) {
            successBox.innerText = msg;
            successBox.style.display = 'block';
            errorBox.style.display = 'none';
        }

        updateBtn.addEventListener('click', handleUpdatePassword);

        document.getElementById('confirm-password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleUpdatePassword();
        });

        // Initialize
        checkAuth();
    </script>
</body>

</html>
